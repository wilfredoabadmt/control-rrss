name: CI Pipeline — GAMEA Social Monitor

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-lint-and-test:
    name: Backend Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gamea_social_monitor
          POSTGRES_USER: gamea_admin
          POSTGRES_PASSWORD: gamea_secure_password_dev_change_in_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run linter (Ruff)
        run: |
          ruff check backend/

      - name: Run type checker (MyPy)
        run: |
          mypy backend/

      - name: Run unit tests with Pytest
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql+asyncpg://gamea_admin:gamea_secure_password_dev_change_in_prod@localhost:5432/gamea_social_monitor
          DATABASE_URL_SYNC: postgresql+psycopg2://gamea_admin:gamea_secure_password_dev_change_in_prod@localhost:5432/gamea_social_monitor
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          JWT_SECRET_KEY: test_secret_key_ci_minimum_32_characters_long_123
          FIELD_ENCRYPTION_KEY: dGhpcy1pcy1hLXNhbXBsZS1mZXJuZXQta2V5LTMyYnl0ZXM=
        run: |
          pytest backend/tests -v --cov=backend --cov-report=xml

  frontend-build:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
