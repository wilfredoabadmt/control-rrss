services:
  postgres:
    image: postgres:16-alpine
    container_name: gamea_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamea_social_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-gamea_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - backups_data:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamea_admin} -d ${POSTGRES_DB:-gamea_social_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis:
    image: redis:7-alpine
    container_name: gamea_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-""}
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: gamea_api_prod
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips='*'
    env_file:
      - .env.production
    volumes:
      - evidence_storage:/app/storage/evidences
      - reports_storage:/app/storage/reports
      - backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: gamea_celery_worker_prod
    restart: always
    command: celery -A workers.celery_app worker -l info --concurrency=4 -E
    env_file:
      - .env.production
    volumes:
      - evidence_storage:/app/storage/evidences
      - reports_storage:/app/storage/reports
      - backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: gamea_celery_beat_prod
    restart: always
    command: celery -A workers.celery_app beat -l info --schedule=/data/celerybeat-schedule
    volumes:
      - celery_schedule:/data
      - backups_data:/backups
    env_file:
      - .env.production
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      target: production
    container_name: gamea_frontend_prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  pgdata_prod:
  redisdata_prod:
  evidence_storage:
  reports_storage:
  celery_schedule:
  backups_data:
